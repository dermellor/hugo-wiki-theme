<div class="{{if eq .style "box"}} bg-dark text-white p-3{{end}}">
<form class="newsletter" action="https://api.marcelmellor.com/v1/newsletter-signup" method="post" data-redirect="{{ .redirect | default "https://www.marcelmellor.com/transactions/newsletter/optin/generic/" }}">
  <div class="">
    <div class="d-md-flex flex-row d-grid gap-3">
      <div class="flex-grow-1">
        <input type="hidden" name="utm_source"/>
        <input type="hidden" name="language" value="{{ .language }}"/>
        <input type="hidden" name="utm_medium" value="{{.utm_medium}}"/>
        <input type="hidden" name="funnel" value="{{.funnel}}"/>
        {{/* Honeypot: hidden from humans, tempting to bots. Filled = dropped server-side. */}}
        <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;height:0;width:0;overflow:hidden;">
          <label>Website</label>
          <input type="text" name="hp_website" tabindex="-1" autocomplete="off" value="">
        </div>
        <input type="email" class="form-control {{if eq .size "big"}} form-control-lg {{end}} {{if eq .style "box"}} border-0 {{else}} border-dark border-2 {{end}}" name="email" aria-describedby="emailHelp" placeholder="{{ i18n "newsletterEmailPlaceholder" }}" required>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn  {{if eq .style "box"}} btn-primary {{else}} btn-primary  {{end}} {{if eq .size "big"}} btn-lg {{end}}">{{ .cta | default (i18n "newsletterCtaDefault") }}</button>
      </div>
    </div>
    <div class="mt-3">
      <small>{{ i18n "newsletterNoAds" }} <a class="align-bottom text-white" href="{{ "/datenschutz" | relLangURL }}">{{ i18n "newsletterPrivacyLink" }}</a></small>
    </div>
  </div>
</form>
</div>
